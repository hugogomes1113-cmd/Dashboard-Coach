<nav><b class="lg">⚽ Dossiê de Treino</b><a href="#hoje"><i>🏠</i>Início</a><a href="#presencas"><i>✅</i>Presenças</a><a class="f" href="#meso"><i>🗂️</i>Mesociclos</a><a class="f" href="#plano"><i>🗓️</i>Plano</a><a class="f" href="#exercicios"><i>📋</i>Exercícios</a><a class="f" href="#atletas"><i>👥</i>Atletas</a><a class="f" href="#jogos"><i>🏆</i>Jogos</a><a href="#dados"><i>💾</i>Dados</a></nav>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['ex','meso','treinos','atletas','jogos'],PT={inicial:'Parte Inicial',fundamental:'Parte Fundamental',final:'Parte Final'};let DB;
const open=()=>new Promise((ok,ko)=>{const r=indexedDB.open('dossie',3);r.onupgradeneeded=()=>[...ST,'cfg'].forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id',autoIncrement:true})});r.onsuccess=()=>{DB=r.result;ok()};r.onerror=ko});

async function aniv(at){const h=dt(hoje());return at.filter(a=>a.nasc).map(a=>{const n=dt(a.nasc);let p=new Date(h.getFullYear(),n.getMonth(),n.getDate(),12);if(p<h)p.setFullYear(h.getFullYear()+1);return{...a,dias:Math.round((p-h)/864e5),idade:p.getFullYear()-n.getFullYear()}}).filter(a=>a.dias<=30).sort((a,b)=>a.dias-b.dias)}
const V={
async hoje(){const [tr,at,jg]=await Promise.all([all('treinos'),all('atletas'),all('jogos')]),h=hoje(),prox=tr.filter(t=>t.data>=h).sort((a,b)=>a.data.localeCompare(b.data))[0],an=await aniv(at),pj=jg.filter(g=>g.gm==null&&g.data>=h).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,3),jf=jg.filter(g=>g.gm!=null),real=tr.filter(t=>t.data<=h&&Object.keys(t.pres).length),ass=real.length&&at.length?Math.round(100*real.reduce((s,t)=>s+at.filter(a=>t.pres[a.id]).length,0)/(real.length*at.length)):null;
return `<h1>Início <span class="mu">${DIAS[dt(h).getDay()]} ${fd(h)}</span></h1><div class="k">${[['Atletas',at.length],['Treinos planeados',tr.length],['Assiduidade média',ass==null?'—':ass+'%'],['Jogos (V-E-D)',jf.length?jf.filter(g=>g.gm>g.gs).length+'-'+jf.filter(g=>g.gm==g.gs).length+'-'+jf.filter(g=>g.gm<g.gs).length:'—']].map(([l,v])=>`<div class="c"><div class="mu">${l}</div><div style="font-size:1.6rem;font-weight:600">${v}</div></div>`).join('')}</div>
<div class="g"><div class="c"><h2>${prox&&prox.data==h?'Treino de hoje':'Próximo treino'}</h2>${prox?`<div class="it" onclick="treino(${prox.id})"><b>${DIAS[dt(prox.data).getDay()]} ${fd(prox.data)}</b> ${esc(prox.hora)}<div class="mu">${Object.keys(PT).map(p=>prox.partes[p].length+' ex. '+p).join(' · ')}</div></div>`:'<span class="mu">Sem treinos planeados.</span>'}</div>
<div class="c"><h2>Próximos jogos</h2>${pj.length?pj.map(g=>`<div>${fd(g.data)} · ${g.casa?'vs':'@'} ${esc(g.adv)} <span class="mu">${esc(g.comp||'')}</span></div>`).join(''):'<span class="mu">Sem jogos marcados.</span>'}</div>
<div class="c"><h2>Aniversários (30 dias)</h2>${an.length?an.map(a=>`<div>${a.dias?`em ${a.dias} d`:'<b>HOJE 🎂</b>'} · ${esc(a.nome)} faz ${a.idade} anos</div>`).join(''):'<span class="mu">Nenhum nos próximos 30 dias.</span>'}</div>${dash(tr,at,jg)}</div>`},
async presencas(){const [tr,at]=await Promise.all([all('treinos'),all('atletas')]),h=dt(hoje());at.sort((a,b)=>a.nome.localeCompare(b.nome));
const l=tr.filter(t=>{const x=(dt(t.data)-h)/864e5;return x>=-21&&x<=14}).sort((a,b)=>a.data.localeCompare(b.data)),sel=($('#pt')||{}).value||(l.find(t=>t.data>=hoje())||l[l.length-1]||{}).id,t=l.find(x=>x.id==sel);
return `<h1>Presenças</h1>${t?`<select id="pt" onchange="go()" style="width:100%">${l.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${DIAS[dt(x.data).getDay()]} ${fd(x.data)} ${esc(x.hora)}</option>`).join('')}</select><p class="mu" id="pc">${at.filter(a=>t.pres[a.id]).length}/${at.length} presentes</p>${at.map(a=>`<label class="c r" style="font-size:1.1rem;padding:14px"><input type="checkbox" style="width:24px;height:24px" ${t.pres[a.id]?'checked':''} onchange="pp(${t.id},${a.id},this.checked)"> ${esc(a.nome)}</label>`).join('')||'<p class="mu">Sem atletas.</p>'}`:'<p class="mu">Sem treinos próximos. Importa os dados em Dados.</p>'}`},
async meso(){const [me,ex]=await Promise.all([all('meso'),all('ex')]);me.sort((a,b)=>(b.mes||b.ini||'').localeCompare(a.mes||a.ini||''));const m=me.find(x=>x.id==MS.id)||me[0];if(m)MS.id=m.id;
const q=($('#bq')||{}).value||'',pp=($('#bp')||{}).value||'',tg=[...new Set(ex.flatMap(e=>e.etiquetas||[]))].sort(),E=id=>ex.find(x=>x.id==id),mi=(e,w)=>e.img?`<img src="${e.img}" style="width:${w}px;height:${Math.round(w*.7)}px;object-fit:cover;border-radius:6px">`:`<div style="width:${w}px;height:${Math.round(w*.7)}px;background:var(--bd);border-radius:6px"></div>`;
const bar=`<div class="c r">${m?`<select id="ms" onchange="MS.id=+this.value;go()">${me.map(x=>`<option value="${x.id}" ${x.id==m.id?'selected':''}>${esc(x.titulo)}</option>`).join('')}</select>`:''}<input id="nm" type="month"><button class="${m?'':'p'}" onclick="novoMeso()">Criar mesociclo</button>${m?`<button class="p" onclick="exportarWord(${m.id})">Exportar Word</button><button class="p" onclick="gerarPlano(${m.id})">Plano treino a treino</button><button onclick="apagarMeso(${m.id})">Apagar</button>`:''}</div>`;
if(!m)return `<h1>Mesociclos</h1>${bar}`;
const it=m.itens||{},dz=diasTreino(m),ya=+(m.mes||m.ini||'').slice(0,4),pl=new Map(planoDe(m)),chips=(x,p,i)=>{const s=new Set(fdat(x.datas));return [...new Set([...dz.map(d=>d.slice(8)+'/'+d.slice(5,7)),...s])].sort(cmpd).map(dd=>`<span class="tag it" style="${s.has(dd)?'background:var(--ac);color:#fff':''}" onclick="tgD('${p}',${i},'${dd}')">${dd.slice(0,2)} ${WDN[new Date(ya,+dd.slice(3)-1,+dd.slice(0,2),12).getDay()]}</span>`).join('')},sel=E(MS.sel),lista=ex.filter(e=>(!pp||e.parte==pp)&&[...TAGS].every(t=>(e.etiquetas||[]).includes(t))&&((e.descricao||'')+(e.objetivos||'')).toLowerCase().includes(q.toLowerCase()));
const pv=sel?(()=>{const [t,r]=resumo(sel,300);return `<div class="c">${sel.img?`<img src="${sel.img}">`:''}<b>${esc(t)}</b> <span class="mu">${PT[sel.parte]} · ${sel.tempo_min||'?'} min</span><p>${esc(r)}</p><div class="mu">${esc((sel.objetivos||'').split('\n').slice(0,3).join(' · '))}</div><div class="r" style="margin-top:8px">${PK.map(p=>`<button class="${p==sel.parte?'p':''}" onclick="addIt('${p}')">+ ${PT[p].replace('Parte ','')}</button>`).join('')}</div></div>`})():'<p class="mu">Escolhe um exercício para ver a pré-visualização.</p>';
return `<h1>Mesociclos</h1>${bar}<div class="cols"><div><div class="c"><div class="r"><input id="bq" placeholder="Pesquisar…" value="${esc(q)}" oninput="go()"><select id="bp" onchange="go()"><option value="">Todas as partes</option>${PK.map(k=>`<option value="${k}" ${pp==k?'selected':''}>${PT[k]}</option>`).join('')}</select></div><div style="margin-top:8px">${tg.map(t=>`<label class="tag it"><input type="checkbox" ${TAGS.has(t)?'checked':''} onchange="tgl(this.dataset.t)" data-t="${esc(t)}"> ${esc(t)}</label>`).join('')}</div></div>${pv}${lista.map(e=>`<div class="c it r" onclick="MS.sel=${e.id};go()" style="${e.id==MS.sel?'outline:2px solid var(--ac)':''}">${mi(e,72)}<div style="flex:1"><div>${esc(tit0(e))}</div><div class="mu">${PT[e.parte]} · ${e.tempo_min||'?'} min</div></div></div>`).join('')||'<p class="mu">Sem resultados.</p>'}</div>
<div><div class="c"><h2>${esc(m.titulo)}</h2><div class="r mu">Dias de treino: ${[1,2,3,4,5,6,0].map(i=>`<label><input type="checkbox" ${(m.dias&&m.dias.length?m.dias:[2,4,5]).includes(i)?'checked':''} onchange="tgW(${i})"> ${WDN[i]}</label>`).join(' ')}</div></div>
<div class="c"><h2>Dias do mês (3 a 5 exercícios para fechar)</h2>${[...new Set([...dz,...pl.keys()])].sort().map(d=>{const n=pl.has(d)?nEx(pl.get(d)):0,ok=n>=3&&n<=5,f=(m.fechados||[]).includes(d);return `<div class="r" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:4px 0"><span>${WDN[dt(d).getDay()]} ${fd(d).slice(0,5)}</span><span style="color:${f?'#16a34a':ok?'var(--ac)':n?'#d97706':'var(--mu)'}">${n} exerc.${n>5?' · excede 5':n&&n<3?' · faltam '+(3-n):''}${f?' · ✔ fechado':''}</span><button ${f||ok?'':'disabled'} onclick="fechar('${d}',${f?0:1})">${f?'Reabrir':'Fechar dia'}</button></div>`}).join('')}</div>${PK.map(p=>{const l=it[p]||[];return `<div class="c"><h2>${PT[p]} · ${l.reduce((s,x)=>s+((E(x.ex)||{}).tempo_min||0),0)} min</h2>${l.map((x,i)=>{const e=E(x.ex);return e?`<div class="r" style="margin-bottom:8px">${mi(e,60)}<div style="flex:1;min-width:140px">${esc(tit0(e))}<div style="margin-top:4px">${chips(x,p,i)}</div></div><button onclick="rmIt('${p}',${i})">✕</button></div>`:''}).join('')||'<span class="mu">Vazio</span>'}</div>`}).join('')}</div></div>`},
async plano(){const [me,ex]=await Promise.all([all('meso'),all('ex')]);me.sort((a,b)=>(b.mes||b.ini||'').localeCompare(a.mes||a.ini||''));const m=me.find(x=>x.id==MS.id)||me[0];if(!m)return '<h1>Plano</h1><p class="mu">Cria primeiro um mesociclo.</p>';MS.id=m.id;
return `<h1>Plano treino a treino</h1><div class="c r noimp"><select onchange="MS.id=+this.value;go()">${me.map(x=>`<option value="${x.id}" ${x.id==m.id?'selected':''}>${esc(x.titulo)}</option>`).join('')}</select><button class="p" onclick="imprimir()">Imprimir / PDF — todos os treinos</button></div>${planoDe(m).map(([d,pt])=>{const L=PK.map(p=>pt[p].map(id=>ex.find(x=>x.id==id)).filter(Boolean)),n=L.flat().length,min=L.flat().reduce((s,e)=>s+(e.tempo_min||0),0);
return `<div class="pg" data-d="${d}" style="--ih:${n<=3?7:n<=6?4.5:3}cm"><div class="ph"><div><b>${DIAS[dt(d).getDay()]} ${fd(d)}</b> · ${esc(m.titulo)} ${(m.fechados||[]).includes(d)?'<span class="noimp" style="color:#16a34a">✔ fechado</span>':'<span class="noimp" style="color:#d97706">por fechar</span>'}</div><div>${min} min</div></div>${PK.map((p,i)=>L[i].length?`<div class="pp"><h3>${PT[p]}</h3>${L[i].map(e=>{const [t,r]=resumo(e,220),ob=(e.objetivos||'').split('\n').filter(Boolean).slice(0,3);return `<div class="ex">${e.img?`<img src="${e.img}">`:'<div></div>'}<div><b>${esc(t)}</b> <span class="mu">${e.tempo_min||'?'} min</span><p>${esc(r)}</p>${ob.length?`<ul>${ob.map(o=>`<li>${esc(o.slice(0,90))}</li>`).join('')}</ul>`:''}</div></div>`}).join('')}</div>`:'').join('')}<div class="noimp r"><button onclick="imprimir('${d}')">Imprimir / PDF este treino</button></div></div>`}).join('')||'<p class="mu">Escreve datas nos exercícios do mesociclo.</p>'}`},
async exercicios(){const ex=await all('ex'),q=($('#q')||{}).value||'',p=($('#p')||{}).value||'';
return `<h1>Exercícios (${ex.length})</h1><div class="r" style="margin-bottom:10px"><button class="p" onclick="edEx()">Novo exercício</button><label class="mu">Importar Word: <input type="file" accept=".docx" onchange="impWord(this.files[0])"></label></div><div class="r"><input id="q" placeholder="Pesquisar…" value="${esc(q)}" oninput="go()"><select id="p" onchange="go()"><option value="">Todas as partes</option>${Object.entries(PT).map(([k,v])=>`<option value="${k}" ${p==k?'selected':''}>${v}</option>`).join('')}</select></div><br>
${ex.filter(e=>(!p||e.parte==p)&&(e.descricao+(e.etiquetas||[]).join(' ')).toLowerCase().includes(q.toLowerCase())).map(e=>`<div class="c it" onclick="exer(${e.id})"><b>${PT[e.parte]}</b> · ${e.tempo_min||'?'} min<div>${esc(e.descricao.slice(0,110))}…</div>${(e.etiquetas||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`).join('')||'<p class="mu">Importa os exercícios em Dados.</p>'}`},
async atletas(){const at=(await all('atletas')).sort((a,b)=>a.nome.localeCompare(b.nome));
return `<h1>Atletas (${at.length})</h1><div class="c"><div class="r"><input id="an" placeholder="Nome"><input id="ad" type="date"><input id="ap" placeholder="Posição"><button class="p" onclick="novoAt()">Adicionar</button></div></div>${at.map(a=>`<div class="c r"><div class="it r" style="flex:1" onclick="ficha(${a.id})">${a.foto?`<img src="${a.foto}" width="40" height="40" style="border-radius:50%;object-fit:cover">`:''}<b>${esc(a.nome)}</b>${media(a)?` <span class="tag">${media(a)}</span>`:''} <span class="mu">${esc(a.pos||'')} ${a.nasc?'· '+fd(a.nasc):''}</span></div><button onclick="apagar('atletas',${a.id})">✕</button></div>`).join('')}`},
async jogos(){const j=(await all('jogos')).sort((a,b)=>b.data.localeCompare(a.data));

async dados(){return `<h1>Dados</h1><div class="c"><h2>Cópia de segurança</h2><p class="mu">Os dados ficam só neste aparelho. Exporta para guardar ou levar para outro aparelho.</p><button class="p" onclick="exportar()">Exportar</button></div><div class="c"><h2>Enviar presenças</h2><p class="mu">No telemóvel: envia as presenças marcadas para o computador (só presenças, não apaga mais nada).</p><button class="p" onclick="enviarPres()">Enviar presenças</button></div><div class="c"><h2>Modelo Word</h2><p class="mu">Carrega o modelo_mesociclo.docx. Fica só neste aparelho.</p><input type="file" accept=".docx" onchange="carregarModelo(this.files[0])"></div><div class="c"><h2>Importar</h2><p class="mu">Aceita a cópia de segurança ou o ficheiro exercicios_para_app.json.</p><input type="file" accept=".json" onchange="importar(this.files[0])"></div>`}};
