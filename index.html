<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dossiê de Treino</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#5b6b7a;--ac:#0f766e;--bd:#dde3e8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mu:#93a4b3;--ac:#2dd4bf;--bd:#2a3743}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:860px;margin:auto;padding:14px}h1{font-size:1.3rem;margin:.2em 0 .6em}h2{font-size:1rem;margin:0 0 .4em;color:var(--mu)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 12px}.it{cursor:pointer}.mu{color:var(--mu);font-size:.85rem}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;max-width:100%}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border:0}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.r>input,.r>select{flex:1;min-width:120px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:12px 4px;color:var(--mu);text-decoration:none;font-size:.8rem}nav a.on{color:var(--ac);font-weight:700}
dialog{width:min(720px,96vw);max-height:92vh;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:14px}dialog img{width:100%;border-radius:10px}
.tag{display:inline-block;background:var(--bd);border-radius:20px;padding:1px 9px;font-size:.75rem;margin:2px 2px 0 0}pre{white-space:pre-wrap;font:inherit;margin:.2em 0 .8em}
</style></head><body><main id="v"></main>
<nav><a href="#hoje">Início</a><a href="#treinos">Treinos</a><a href="#exercicios">Exercícios</a><a href="#atletas">Atletas</a><a href="#dados">Dados</a></nav>
<dialog id="d"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['ex','meso','treinos','atletas'],PT={inicial:'Parte Inicial',fundamental:'Parte Fundamental',final:'Parte Final'};let DB;
const open=()=>new Promise((ok,ko)=>{const r=indexedDB.open('dossie',1);r.onupgradeneeded=()=>ST.forEach(s=>r.result.createObjectStore(s,{keyPath:'id',autoIncrement:true}));r.onsuccess=()=>{DB=r.result;ok()};r.onerror=ko});
const tx=(s,m,f)=>new Promise((ok,ko)=>{const t=DB.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r.result);t.onerror=ko});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,x)=>tx(s,'readwrite',o=>o.put(x)),del=(s,id)=>tx(s,'readwrite',o=>o.delete(id));
const hoje=()=>new Date().toLocaleDateString('sv'),fd=d=>d.split('-').reverse().join('/'),dt=s=>new Date(s+'T12:00:00');
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
async function aniv(at){const h=dt(hoje());return at.filter(a=>a.nasc).map(a=>{const n=dt(a.nasc);let p=new Date(h.getFullYear(),n.getMonth(),n.getDate(),12);if(p<h)p.setFullYear(h.getFullYear()+1);return{...a,dias:Math.round((p-h)/864e5),idade:p.getFullYear()-n.getFullYear()}}).filter(a=>a.dias<=30).sort((a,b)=>a.dias-b.dias)}
const V={
async hoje(){const [tr,at]=await Promise.all([all('treinos'),all('atletas')]),h=hoje(),prox=tr.filter(t=>t.data>=h).sort((a,b)=>a.data.localeCompare(b.data))[0],an=await aniv(at);
return `<h1>Início</h1><div class="c"><h2>${prox&&prox.data==h?'Treino de hoje':'Próximo treino'}</h2>${prox?`<div class="it" onclick="treino(${prox.id})"><b>${DIAS[dt(prox.data).getDay()]} ${fd(prox.data)}</b> ${esc(prox.hora)}<div class="mu">${Object.keys(PT).map(p=>prox.partes[p].length+' ex. '+p).join(' · ')}</div></div>`:'<span class="mu">Sem treinos planeados. Cria um mesociclo em Treinos.</span>'}</div>
<div class="c"><h2>Aniversários (30 dias)</h2>${an.length?an.map(a=>`<div>${a.dias?`em ${a.dias} d`:'<b>HOJE 🎂</b>'} · ${esc(a.nome)} faz ${a.idade} anos</div>`).join(''):'<span class="mu">Nenhum nos próximos 30 dias.</span>'}</div>
<div class="c"><h2>Resumo</h2>${at.length} atletas · ${tr.length} treinos planeados</div>`},
async treinos(){const [tr,me]=await Promise.all([all('treinos'),all('meso')]);tr.sort((a,b)=>a.data.localeCompare(b.data));const h=hoje();
return `<h1>Treinos</h1><div class="c"><h2>Novo mesociclo (gera os treinos)</h2><div class="r"><input id="mt" placeholder="Título"><input id="mi" type="date"><input id="mf" type="date"><input id="mh" placeholder="Hora (ex. 18:15)"></div><div class="r" style="margin:8px 0">${[1,2,3,4,5,6,0].map(i=>`<label><input type="checkbox" class="md" value="${i}"> ${DIAS[i]}</label>`).join(' ')}</div><button class="p" onclick="gerar()">Gerar treinos</button></div>
${tr.map(t=>`<div class="c it" onclick="treino(${t.id})" style="${t.data<h?'opacity:.6':''}"><b>${DIAS[dt(t.data).getDay()]} ${fd(t.data)}</b> ${esc(t.hora)} <span class="mu">${esc((me.find(m=>m.id==t.meso)||{}).titulo||'')}</span><div class="mu">${Object.keys(PT).map(p=>t.partes[p].length).join(' / ')} exercícios</div></div>`).join('')||'<p class="mu">Sem treinos.</p>'}`},
async exercicios(){const ex=await all('ex'),q=($('#q')||{}).value||'',p=($('#p')||{}).value||'';
return `<h1>Exercícios (${ex.length})</h1><div class="r"><input id="q" placeholder="Pesquisar…" value="${esc(q)}" oninput="go()"><select id="p" onchange="go()"><option value="">Todas as partes</option>${Object.entries(PT).map(([k,v])=>`<option value="${k}" ${p==k?'selected':''}>${v}</option>`).join('')}</select></div><br>
${ex.filter(e=>(!p||e.parte==p)&&(e.descricao+(e.etiquetas||[]).join(' ')).toLowerCase().includes(q.toLowerCase())).map(e=>`<div class="c it" onclick="exer(${e.id})"><b>${PT[e.parte]}</b> · ${e.tempo_min||'?'} min<div>${esc(e.descricao.slice(0,110))}…</div>${(e.etiquetas||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`).join('')||'<p class="mu">Importa os exercícios em Dados.</p>'}`},
async atletas(){const at=(await all('atletas')).sort((a,b)=>a.nome.localeCompare(b.nome));
return `<h1>Atletas (${at.length})</h1><div class="c"><div class="r"><input id="an" placeholder="Nome"><input id="ad" type="date"><input id="ap" placeholder="Posição"><button class="p" onclick="novoAt()">Adicionar</button></div></div>${at.map(a=>`<div class="c r"><div class="it r" style="flex:1" onclick="ficha(${a.id})">${a.foto?`<img src="${a.foto}" width="40" height="40" style="border-radius:50%;object-fit:cover">`:''}<b>${esc(a.nome)}</b>${media(a)?` <span class="tag">${media(a)}</span>`:''} <span class="mu">${esc(a.pos||'')} ${a.nasc?'· '+fd(a.nasc):''}</span></div><button onclick="apagar('atletas',${a.id})">✕</button></div>`).join('')}`},
async dados(){return `<h1>Dados</h1><div class="c"><h2>Cópia de segurança</h2><p class="mu">Os dados ficam só neste aparelho. Exporta para guardar ou levar para outro aparelho.</p><button class="p" onclick="exportar()">Exportar</button></div><div class="c"><h2>Importar</h2><p class="mu">Aceita a cópia de segurança ou o ficheiro exercicios_para_app.json.</p><input type="file" accept=".json" onchange="importar(this.files[0])"></div>`}};
async function go(){const k=(location.hash.slice(1)||'hoje'),f=document.activeElement.id,pos=document.activeElement.selectionStart;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.hash=='#'+k));$('#v').innerHTML=await(V[k]||V.hoje)();if(f&&$('#'+f)){$('#'+f).focus();try{$('#'+f).setSelectionRange(pos,pos)}catch(e){}}}
async function exer(id){const e=(await all('ex')).find(x=>x.id==id),h=hoje(),tr=(await all('treinos')).filter(t=>t.data>=h).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,40);
const f=(t,v)=>v?`<h2>${t}</h2><pre>${esc(v)}</pre>`:'';
$('#d').innerHTML=`${e.img?`<img src="${e.img}">`:''}<h2>${PT[e.parte]} · ${e.tempo_min||'?'} min</h2>${f('Descrição',e.descricao)}${f('Objetivos',e.objetivos)}${f('Critérios de êxito',e.criterios_exito)}${f('Variantes',e.variantes)}${f('Instrução / Feedback',e.instrucoes)}
<div class="r"><select id="dt">${tr.map(t=>`<option value="${t.id}">${fd(t.data)}</option>`).join('')}</select><button class="p" onclick="addEx(${e.id})">Adicionar ao treino</button><button onclick="$('#d').close()">Fechar</button></div>`;$('#d').showModal()}
async function addEx(id){const t=(await all('treinos')).find(x=>x.id==$('#dt').value),e=(await all('ex')).find(x=>x.id==id);if(!t)return alert('Cria primeiro um mesociclo em Treinos.');if(!t.partes[e.parte].includes(id))t.partes[e.parte].push(id);await put('treinos',t);$('#d').close()}
async function treino(id){const [t,ex,at]=await Promise.all([all('treinos').then(l=>l.find(x=>x.id==id)),all('ex'),all('atletas')]);
$('#d').innerHTML=`<h1>${DIAS[dt(t.data).getDay()]} ${fd(t.data)} ${esc(t.hora)}</h1>${Object.entries(PT).map(([p,n])=>`<h2>${n}</h2>${t.partes[p].map(i=>ex.find(e=>e.id==i)).filter(Boolean).map(e=>`<div class="c r"><div style="flex:1" onclick="exer(${e.id})">${esc(e.descricao.slice(0,90))}… <span class="mu">${e.tempo_min||'?'} min</span></div><button onclick="tirar(${t.id},'${p}',${e.id})">✕</button></div>`).join('')||'<div class="mu">—</div>'}`).join('')}
<h2>Presenças (${at.filter(a=>t.pres[a.id]).length}/${at.length})</h2>${at.map(a=>`<label class="c r"><input type="checkbox" ${t.pres[a.id]?'checked':''} onchange="pres(${t.id},${a.id},this.checked)"> ${esc(a.nome)}</label>`).join('')||'<div class="mu">Sem atletas.</div>'}
<h2>Notas</h2><textarea style="width:100%" rows="3" onchange="nota(${t.id},this.value)">${esc(t.notas)}</textarea><div class="r"><button onclick="$('#d').close();go()">Fechar</button></div>`;if(!$('#d').open)$('#d').showModal()}
const mut=async(id,f)=>{const t=(await all('treinos')).find(x=>x.id==id);f(t);await put('treinos',t);return t};
const tirar=async(id,p,e)=>{await mut(id,t=>t.partes[p]=t.partes[p].filter(x=>x!=e));treino(id)},pres=(id,a,v)=>mut(id,t=>t.pres[a]=v).then(()=>treino(id)),nota=(id,v)=>mut(id,t=>t.notas=v);
async function gerar(){const i=$('#mi').value,f=$('#mf').value,dias=[...document.querySelectorAll('.md:checked')].map(x=>+x.value);if(!i||!f||!dias.length)return alert('Indica datas e dias de treino.');
const m={titulo:$('#mt').value||'Mesociclo'};const mid=await tx('meso','readwrite',o=>o.add(m));let n=0;for(let d=dt(i);d<=dt(f);d.setDate(d.getDate()+1))if(dias.includes(d.getDay())){await put('treinos',{meso:mid,data:d.toLocaleDateString('sv'),hora:$('#mh').value,partes:{inicial:[],fundamental:[],final:[]},pres:{},notas:''});n++}alert(n+' treinos criados.');go()}
const novoAt=async()=>{if(!$('#an').value)return;await put('atletas',{nome:$('#an').value,nasc:$('#ad').value,pos:$('#ap').value});go()};
const apagar=async(s,id)=>{if(confirm('Apagar?')){await del(s,id);go()}};
async function exportar(){const o={};for(const s of ST)o[s]=await all(s);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='dossie_'+hoje()+'.json';a.click()}
async function importar(f){if(!f)return;const o=JSON.parse(await f.text());let n=0;for(const s of ST)for(const x of o[s]||[]){await put(s,x);n++}alert(n+' registos importados.');go()}

const VAL={Técnicas:['Passe','Receção','Drible','Remate','Controlo de bola'],Físicas:['Velocidade','Resistência','Força','Agilidade'],Mentais:['Decisão','Concentração','Trabalho de equipa','Atitude','Coragem']};
const media=a=>{const v=Object.values(((a.aval||[]).slice(-1)[0]||{}).val||{});return v.length?(v.reduce((x,y)=>x+y,0)/v.length).toFixed(1):''};
async function ficha(id){const a=(await all('atletas')).find(x=>x.id==id),av=a.aval||[],u=(av.slice(-1)[0]||{}).val||{},p=(av.slice(-2)[0]||{}).val||{};
const dl=k=>av.length>1&&u[k]!=null&&p[k]!=null&&u[k]!=p[k]?(u[k]>p[k]?' <span style="color:#16a34a">▲'+(u[k]-p[k])+'</span>':' <span style="color:#dc2626">▼'+(p[k]-u[k])+'</span>'):'';
$('#d').innerHTML=`<div class="r">${a.foto?`<img src="${a.foto}" style="width:80px;height:80px;border-radius:50%;object-fit:cover">`:''}<div style="flex:1"><h1>${esc(a.nome)}</h1><span class="mu">Média ${media(a)||'—'} · ${av.length} avaliações${av.length?' · última '+fd(av.slice(-1)[0].data):''}</span></div></div>
<div class="r" style="margin:8px 0"><input id="fn" value="${esc(a.nome)}" placeholder="Nome"><input id="fd" type="date" value="${a.nasc||''}"><input id="fp" value="${esc(a.pos||'')}" placeholder="Posição"><select id="fe"><option ${a.pe=='Direito'?'selected':''}>Direito</option><option ${a.pe=='Esquerdo'?'selected':''}>Esquerdo</option><option ${a.pe=='Ambos'?'selected':''}>Ambos</option></select><input id="fc" value="${esc(a.contacto||'')}" placeholder="Contacto do encarregado"><input id="fl" value="${esc(a.lesao||'')}" placeholder="Lesão / nota médica"></div>
<input type="file" accept="image/*" onchange="foto(${id},this.files[0])">
${Object.entries(VAL).map(([g,l])=>`<h2>${g}</h2>${l.map(k=>`<div class="r"><span style="width:150px">${k}${dl(k)}</span><input type="range" min="1" max="20" value="${u[k]||10}" data-k="${k}" style="flex:1" oninput="this.nextElementSibling.textContent=this.value"><b style="width:24px">${u[k]||10}</b></div>`).join('')}`).join('')}
<h2>Notas de observação</h2><textarea id="fo" style="width:100%" rows="3">${esc(a.notas||'')}</textarea>
<div class="r"><button onclick="gFicha(${id},0)">Guardar dados</button><button class="p" onclick="gFicha(${id},1)">Guardar dados + nova avaliação</button><button onclick="$('#d').close();go()">Fechar</button></div>`;if(!$('#d').open)$('#d').showModal()}
async function gFicha(id,av){const a=(await all('atletas')).find(x=>x.id==id);Object.assign(a,{nome:$('#fn').value||a.nome,nasc:$('#fd').value,pos:$('#fp').value,pe:$('#fe').value,contacto:$('#fc').value,lesao:$('#fl').value,notas:$('#fo').value});
if(av){const val={};document.querySelectorAll('#d [data-k]').forEach(i=>val[i.dataset.k]=+i.value);(a.aval=a.aval||[]).push({data:hoje(),val})}await put("atletas",a);return ficha(id)}
function foto(id,f){if(!f)return;const im=new Image();im.onload=async()=>{const c=document.createElement('canvas'),z=Math.min(1,200/Math.min(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const a=(await all('atletas')).find(x=>x.id==id);a.foto=c.toDataURL('image/jpeg',.8);await put("atletas",a);return ficha(id)};im.src=URL.createObjectURL(f)}
open().then(()=>{go();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')});addEventListener('hashchange',go);
</script></body></html>
